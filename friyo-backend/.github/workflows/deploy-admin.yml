name: Deploy Admin Panel — friyo-admin

on:
  push:
    branches: [main]
    paths:
      - '../friyo-admin/**'
  workflow_dispatch:

concurrency:
  group: deploy-admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Build & type-check ─────────────────────────────────────────────────
  build:
    name: Build Next.js admin panel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ../friyo-admin/package-lock.json

      - name: Install dependencies
        working-directory: ../friyo-admin
        run: npm ci

      - name: Type check
        working-directory: ../friyo-admin
        run: npx tsc --noEmit

      - name: Build
        working-directory: ../friyo-admin
        env:
          NEXTAUTH_SECRET:   ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL:      https://admin.friyo.app
          NEXT_PUBLIC_API_URL: https://api.friyo.app/api/v1
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-build
          path: ../friyo-admin/.next
          retention-days: 1

  # ── 2a. Deploy to Vercel (preferred) ─────────────────────────────────────
  deploy-vercel:
    name: Deploy to Vercel
    needs: build
    runs-on: ubuntu-latest
    # Remove the `if` condition to use Vercel; comment out and use deploy-s3 for S3/CloudFront
    if: ${{ vars.DEPLOY_TARGET == 'vercel' || vars.DEPLOY_TARGET == '' }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token:   ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id:  ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ../friyo-admin
          vercel-args: '--prod'
          alias-domains: admin.friyo.app

  # ── 2b. Deploy to S3 + CloudFront (alternative) ──────────────────────────
  deploy-s3:
    name: Deploy to S3 + CloudFront
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_TARGET == 's3' }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-panel-build
          path: .next

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync .next/static \
            s3://${{ secrets.ADMIN_S3_BUCKET }}/_next/static \
            --cache-control "public,max-age=31536000,immutable" \
            --delete

          aws s3 sync .next/server \
            s3://${{ secrets.ADMIN_S3_BUCKET }}/_next/server \
            --cache-control "no-cache,no-store,must-revalidate" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.ADMIN_CF_DISTRIBUTION_ID }} \
            --paths "/*"
